[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcetrail"
version = "0.1.0"
description = "Trace a claim back to the exact page, cell or line in your own files that supports or contradicts it."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["openpyxl>=3.1", "python-docx>=1.1", "pypdfium2>=4.30"]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[project.scripts]
sourcetrail = "sourcetrail.cli:main"

[tool.setuptools]
packages = ["sourcetrail"]
